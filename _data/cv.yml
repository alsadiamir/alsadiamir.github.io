      description:
        - title: <a href="https://c3infer.github.io/">C3Infer</a> - built Mica, a platform for confidential and sandboxed AI workflows
          contents:
            - <a href="https://www.aisi.gov.uk/grants">AISI-funded</a> project to run secure multi-component AI inference pipelines by restricting and attesting communication between confidential components.
